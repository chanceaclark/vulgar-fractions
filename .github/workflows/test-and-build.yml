name: Test & Build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22
          - 24

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - name: Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node_version }}
        cache: 'pnpm'
    - run: pnpm install
    - run: pnpm lint
    - run: pnpm exec jest --coverage
    - run: pnpm build
